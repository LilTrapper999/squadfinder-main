<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="accent" gradientUnits="userSpaceOnUse" x1="40" y1="40" x2="472" y2="472">
      <stop offset="0" stop-color="#ff5a6e"/>
      <stop offset="1" stop-color="#ff9a3c"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="104" fill="#12141c"/>
  <!-- crosshair ring -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="url(#accent)" stroke-width="18"/>
  <!-- crosshair ticks -->
  <g stroke="url(#accent)" stroke-width="18" stroke-linecap="round">
    <line x1="256" y1="40" x2="256" y2="112"/>
    <line x1="256" y1="400" x2="256" y2="472"/>
    <line x1="40" y1="256" x2="112" y2="256"/>
    <line x1="400" y1="256" x2="472" y2="256"/>
  </g>
  <!-- SF monogram -->
  <text x="256" y="306" text-anchor="middle" font-family="'Arial Black', 'Segoe UI', Arial, sans-serif" font-weight="900" font-size="150" letter-spacing="-4" fill="#ffffff">SF</text>
  <!-- center dot -->
  <circle cx="256" cy="352" r="9" fill="url(#accent)"/>
</svg>
