name: E2E

# Backend-free browser checks (public pages, headers, responsive sweep) against a production build.
# Playwright is installed for this job only; it is not a project dependency. Flows that need a
# database (sign-in, requests, accept/decline) are not here: they need a Supabase test project.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Public placeholder values; the pages under test never need a live backend.
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm i --no-save @playwright/test@1.49.1
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npx playwright test -c e2e/playwright.config.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7
